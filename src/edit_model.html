<a class="back" href="/#models-heading">← Models</a>
<header class="page-title"><h1>$title</h1></header>
$notice
$key_form
<form class="panel profile-editor" method="post" action="/model">
  <input type="hidden" name="revision" value="$revision">
  <input type="hidden" name="original" value="$original">
  <fieldset><legend>Model connection</legend>
    <div class="fields">$basic</div>
    $default_field
  </fieldset>
  <details $advanced_open><summary>Advanced settings</summary>
    <fieldset><legend>Generation and caching</legend><div class="fields">$generation</div></fieldset>
    <fieldset><legend>Model limits</legend><div class="fields">$limits</div></fieldset>
    <fieldset><legend>Cost per million tokens</legend><div class="fields">$pricing</div></fieldset>
    <fieldset><legend>Identifiers and environment</legend><div class="fields">$identifiers</div></fieldset>
  </details>
  <footer><button class="primary">Save model</button><a href="/">Back to settings</a></footer>
</form>
