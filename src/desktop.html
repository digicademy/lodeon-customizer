<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LODEON Customizer</title>
  <link rel="icon" href="$favicon" data-day="$favicon" data-night="$favicon_dark">
  <script>$theme_script</script>
  <style>$css</style>
</head>
<body>
  <header class="ld-topbar customizer-topbar">
    <a class="ld-brand" href="/" aria-label="LODEON Customizer home">
      <img class="ld-brand-wordmark ld-brand-wordmark-light" src="$logo_light" alt="LODEON">
      <img class="ld-brand-wordmark ld-brand-wordmark-dark" src="$logo_dark" alt="LODEON">
      <span class="brand-name">Customizer</span>
    </a>
    $connection
    <div class="ld-actions">
      $action
      <div class="ld-action-group ld-utility-actions" data-customizer-theme></div>
    </div>
  </header>
  <main>$content</main>
</body>
</html>
