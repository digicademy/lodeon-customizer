<header class="page-title">
  <h1>LODEON Customizer</h1>
  <p>Personalize models, knowledge graphs, and other settings of a LODEON instance.</p>
</header>
$notice
<div class="workspace">
  <section class="model-sections" aria-labelledby="models-heading">
    <h2 id="models-heading">$models_icon Models</h2>
    <section class="panel" aria-labelledby="personal-heading">
      <div class="panel-head">
        <h3 id="personal-heading">Personal models</h3>
        <div class="actions">
          <a class="ld-button" href="/models/new">Add model</a>
          <a class="ld-button" href="/brokers/new">Add broker</a>
        </div>
      </div>
      $models
    </section>
    <section class="panel" aria-labelledby="instance-heading">
      <div class="panel-head">
        <h3 id="instance-heading">Instance models</h3>
        <a class="ld-button" href="/">Refresh list</a>
      </div>
      $instance_models
    </section>
  </section>
  <aside class="model-sections files" aria-labelledby="files-heading">
    <h2 id="files-heading">$folder_icon Local package</h2>
    <div class="panel">
      $folder_form
      $manifest_form
    </div>
  </aside>
</div>
