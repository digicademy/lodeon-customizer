spec:
  inputs:
    github_run_id:
      description: Completed desktop workflow run on the GitHub mirror
      default: '0'
      regex: '^[0-9]+$'
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'

stages: [import, review, acceptance, publish]

default:
  image: alpine:3.22

native-app:
  stage: import
  parallel:
    matrix:
      - DESKTOP_TARGET: [windows-x86_64, macos-arm64, macos-x86_64, linux-arm64, linux-x86_64]
  variables:
    GIT_STRATEGY: empty
    GH_REPO: digicademy/lodeon-customizer
    GH_RUN_ID: '$[[ inputs.github_run_id ]]'
  script:
    - apk add --no-cache github-cli jq
    - |
      set -eu
      export GH_TOKEN="${GITHUB_ACTIONS_READ_TOKEN:?Set the GitHub Actions read token in GitLab CI/CD variables}"
      gh api "repos/$GH_REPO/actions/runs/$GH_RUN_ID" |
        jq -e --arg repo "$GH_REPO" --arg sha "$CI_COMMIT_SHA" --arg ref "$CI_COMMIT_REF_NAME" '
          .head_repository.full_name == $repo and .head_sha == $sha and .head_branch == $ref and
          .path == ".github/workflows/desktop.yml" and .event == "push" and .conclusion == "success"' || {
          echo "Expected a successful desktop build of $CI_COMMIT_REF_NAME at $CI_COMMIT_SHA in GitHub run $GH_RUN_ID." >&2
          exit 1
        }
      gh run download "$GH_RUN_ID" --repo "$GH_REPO" --name "candidate-$DESKTOP_TARGET" --dir incoming
      channel=latest
      ref="refs/heads/main"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then channel=${CI_COMMIT_TAG#v}; ref="refs/tags/$CI_COMMIT_TAG"; fi
      test "$(cat incoming/CUSTOMIZER-REF)" = "$ref"
      grep -Exq '[0-9a-f]{40}' incoming/CORE-REVISION
      case "$DESKTOP_TARGET" in linux-*) ext=tar.gz ;; *) ext=zip ;; esac
      archive="LODEON-Customizer-$channel-$DESKTOP_TARGET.$ext"
      mkdir -p dist revisions
      mv "incoming/$archive" dist/
      mv incoming/CORE-REVISION "revisions/$DESKTOP_TARGET"
  artifacts:
    name: candidate-$DESKTOP_TARGET
    paths: [dist/, revisions/]
    expire_in: 30 days

desktop-review:
  stage: review
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false
  needs:
    - job: native-app
      artifacts: false
  script:
    - echo "Maintainer confirmed the signed candidates and browser checks in the README."

accepted-archives:
  stage: acceptance
  resource_group: desktop-publication
  needs:
    - native-app
    - job: desktop-review
      artifacts: false
      optional: true
  script:
    - |
      set -eu
      sort -u revisions/* > dist/CORE-REVISION
      if [ "$(wc -l < dist/CORE-REVISION)" -ne 1 ]; then
        echo "The platform archives contain different Core revisions." >&2
        exit 1
      fi
      (cd dist && sha256sum LODEON-Customizer-* > SHA256SUMS)
      test "$(wc -l < dist/SHA256SUMS)" -eq 5
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        apk add --no-cache python3
        python3 release/publish.py
      fi
  artifacts:
    paths: [dist/SHA256SUMS, dist/CORE-REVISION]

download-page:
  stage: publish
  needs:
    - job: accepted-archives
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -s pages/index.html && test -s pages/styles.css && test -s pages/releases.js && test -s pages/lodeon.svg
  pages:
    publish: pages
